<!doctype html>

<title>Doorprize PRO</title>
<style>
:root{--bg:#071225;--card:#0d172c;--line:#24314a;--text:#f5f7fb;--muted:#9ba8bf;--green:#22c55e;--red:#ef4444;--gold:#f5c451;--blue:#4f8cff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#060c1b,#0a1930);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.brand{font-size:27px;font-weight:800}.brand span{color:var(--gold)}.sub{color:var(--muted);margin-top:5px}.btn{border:1px solid var(--line);background:#111b31;color:#fff;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn.primary{background:#173d83;border-color:#2858a5}.btn.green{background:#0e6130;border-color:#199449}.btn.red{background:#5d1921;border-color:#9d2936}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:rgba(10,20,39,.94);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 60px #0003}.scanner{min-height:470px}.reader{width:100%;max-width:850px;margin:auto;min-height:360px;border:2px dashed #53627c;border-radius:18px;overflow:hidden;background:#f6f7fb;color:#111}.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.manual{display:flex;gap:10px;margin-top:14px}.manual input{flex:1;min-width:180px;background:#071020;border:1px solid var(--line);color:#fff;border-radius:12px;padding:14px;font-size:16px}.result{margin-top:15px;padding:15px;border-radius:14px;border:1px solid var(--line);background:#0a1428;min-height:72px}.ok{border-color:#1e9d50;background:#082518}.warn{border-color:#b7791f;background:#2a1d08}.err{border-color:#a42b37;background:#2a0b11}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border-radius:14px;background:#0a1427;border:1px solid var(--line)}.stat b{display:block;font-size:28px;margin-top:4px}.filters{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.pill{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#0a1427;color:#fff;cursor:pointer;font-weight:700}.pill.active{background:#214a86}.table{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:14px}.row{display:grid;grid-template-columns:70px 1.5fr 1fr 150px;gap:10px;padding:12px;border-bottom:1px solid #1b2740;align-items:center}.head{position:sticky;top:0;background:#101b31;font-weight:800}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.hadir{background:#0c4c28;color:#76ef9d}.belum{background:#4b3510;color:#ffd66b}.menang{background:#3d275d;color:#d7b5ff}.toast{position:fixed;right:20px;bottom:20px;max-width:450px;padding:15px 18px;border-radius:14px;background:#101b31;border:1px solid var(--line);display:none;z-index:20}.small{font-size:13px;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:50px 1fr 110px}.row .dept{display:none}}@media(max-width:600px){.wrap{padding:12px}.stats{grid-template-columns:1fr}.manual{flex-direction:column}}
</style>
<style>
body
{
font-family:Segoe UI,Arial;
background:#071225;
color:#fff;margin:0
}
.wrap
{
max-width:1500px;
margin:auto;
padding:40px}
.card
{
background:#0d172c;

}

p

        /* Wadah utama untuk membuat ikon sejajar */
        .icon-container {
            display: block;       /* Mengaktifkan block */
            gap: 20px;          /* Jarak antar ikon */
            justify-content: center; /* Mengatur ikon di tengah secara horizontal */
            align-items: center;     /* Mengatur ikon di tengah secara vertikal */
            padding: 20px;
        }

        /* Gaya dasar untuk link ikon */
        .icon-link {
            transition: transform 0.3s ease, opacity 0.3s ease; /* Efek transisi halus */
            display: inline-block;
        }

        /* Ukuran gambar ikon */
        .icon-link img {
            width: 90%;        /* Atur lebar ikon */
            height: 90%;       /* Atur tinggi ikon */
            object-fit: contain;
        }

        /* EFEK HOVER: Membesar dan sedikit memudar saat kursor di atasnya */
        .icon-link:hover {
            transform: scale(1.1); /* Membesarkan ikon sebesar 10% */
            opacity: 0.5;          /* Mengurangi kejelasan gambar */
        }

</style>
</head>
